<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM | 영어 학습유형 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --paper: #F4F5F7;
  --ink: #1C2541;
  --ink-soft: #4A5578;
  --coral: #E8633C;
  --teal: #2A9D8F;
  --gold: #E8A33C;
  --line: #DDE1E8;
  --card: #FFFFFF;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Pretendard', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.font-display { font-family: 'Gowun Batang', serif; }

#app { max-width: 720px; margin: 0 auto; min-height: 100vh; position: relative; }

.screen { display: none; padding: 32px 24px 80px; animation: fadeIn 0.35s ease; }
.screen.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 공통 ===== */
.eyebrow {
  font-size: 13px; letter-spacing: 0.08em; color: var(--ink-soft);
  font-weight: 600; text-transform: uppercase; margin-bottom: 8px;
}

/* ===== 랜딩 ===== */
.prism-hero {
  padding: 56px 0 0;
  display: flex; flex-direction: column; align-items: center;
}
.prism-diagram { width: 100%; max-width: 360px; display: block; margin: 0 auto; }

.prism-wordmark {
  font-family: 'Gowun Batang', serif;
  font-size: 15px; font-weight: 700; letter-spacing: 0.18em;
  color: var(--ink); margin-top: 4px; text-align: center;
}

.landing-title {
  font-family: 'Gowun Batang', serif;
  font-size: 32px; font-weight: 700; line-height: 1.45;
  margin: 22px 0 10px; text-align: center;
}
.landing-title .accent { color: var(--coral); }
.landing-sub { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 40px; text-align: center; }

.level-list { display: flex; flex-direction: column; gap: 12px; }

.level-card {
  position: relative; display: flex; align-items: center; gap: 0;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 0;
  cursor: pointer; overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  text-align: left; width: 100%; font-family: inherit;
}
.level-card:hover {
  transform: translateX(3px);
  box-shadow: 0 8px 20px rgba(28,37,65,0.07);
}
.level-stripe {
  flex-shrink: 0; width: 8px; align-self: stretch;
}
.level-stripe.g1 { background: var(--coral); }
.level-stripe.g2 { background: var(--teal); }
.level-stripe.g3 { background: var(--gold); }
.level-card-body { display: flex; align-items: center; gap: 14px; padding: 18px 20px; flex: 1; }
.level-grade-tag {
  flex-shrink: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
  padding: 4px 10px; border-radius: 100px; color: white; white-space: nowrap;
}
.level-grade-tag.g1 { background: var(--coral); }
.level-grade-tag.g2 { background: var(--teal); }
.level-grade-tag.g3 { background: var(--gold); }
.level-info { flex: 1; }
.level-label { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
.level-sub { font-size: 12.5px; color: var(--ink-soft); }
.level-arrow { color: var(--ink-soft); font-size: 18px; flex-shrink: 0; padding-right: 4px; }

.contact-box {
  margin-top: 44px; padding: 20px 0; text-align: center;
  border-top: 1px solid var(--line);
}
.contact-box .label {
  font-family: 'Gowun Batang', serif; font-size: 13px; letter-spacing: 0.1em;
  color: var(--ink-soft); margin-bottom: 6px;
}
.contact-box .value { font-weight: 600; font-size: 12.5px; color: var(--ink-soft); }

/* ===== 검사 소개 ===== */
.intro-stats {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  margin: 24px 0 32px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 8px; text-align: center;
}
.stat-num { font-size: 22px; font-weight: 700; }
.stat-label { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

.form-section-title {
  font-size: 14px; font-weight: 700; color: var(--ink-soft);
  letter-spacing: 0.04em; margin: 28px 0 14px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-soft); }
.field input, .field select {
  width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px;
  font-size: 15px; font-family: inherit; background: white; color: var(--ink);
}
.field input:focus, .field select:focus { outline: 2px solid var(--coral); outline-offset: 1px; }
.field .hint { font-size: 12px; color: #999; margin-top: 4px; }
.field .error { font-size: 12px; color: var(--coral); margin-top: 4px; display: none; }

.btn-primary {
  width: 100%; padding: 16px; background: var(--ink); color: white;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
  cursor: pointer; margin-top: 24px; transition: opacity 0.15s;
  font-family: inherit;
}
.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-text {
  width: 100%; padding: 12px; background: none; border: none;
  color: var(--ink-soft); font-size: 14px; cursor: pointer; font-family: inherit;
}

/* ===== 검사 진행 ===== */
.progress-track { height: 6px; background: var(--line); border-radius: 100px; overflow: hidden; margin-bottom: 8px; }
.progress-fill { height: 100%; background: var(--coral); border-radius: 100px; transition: width 0.3s ease; }
.progress-label { font-size: 13px; color: var(--ink-soft); text-align: right; margin-bottom: 40px; font-weight: 600; }

.q-text {
  font-size: 22px; font-weight: 700; line-height: 1.5; margin-bottom: 32px;
  min-height: 100px;
}

.option-card {
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 20px; margin-bottom: 14px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  text-align: left; width: 100%; font-family: inherit;
}
.option-card:hover { border-color: var(--coral); background: #FFF9F6; }
.option-letter {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
  background: var(--ink); color: white; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}
.option-text { font-size: 16px; padding-top: 4px; line-height: 1.5; }

.nav-row { display: flex; justify-content: center; margin-top: 8px; }
.nav-back {
  background: none; border: none; color: var(--ink-soft); font-size: 14px;
  cursor: pointer; padding: 10px; font-family: inherit;
}

/* ===== 결과지 ===== */
.print-bar {
  position: sticky; top: 0; z-index: 10; background: var(--paper);
  display: flex; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.print-btn {
  flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--ink);
  background: white; color: var(--ink); font-weight: 700; font-size: 14px;
  cursor: pointer; font-family: inherit;
}
.print-btn.primary { background: var(--ink); color: white; }

.result-page {
  background: white; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 32px 24px; margin-bottom: 20px;
}
.result-header { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.result-header .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.result-header .meta { font-size: 13px; color: var(--ink-soft); }

.section-title {
  font-size: 16px; font-weight: 700; margin: 28px 0 16px;
  display: flex; align-items: center; gap: 8px;
}
.section-title:first-child { margin-top: 0; }

/* 레이어별 색상 변수 */
:root {
  --l1-color: #E8633C;
  --l2-color: #2A9D8F;
  --l3-color: #6B5CA5;
}

.layer-block {
  border-radius: 16px; padding: 22px 18px; margin-bottom: 24px;
  border: 1.5px solid var(--line);
}
.layer-block:last-child { margin-bottom: 0; }
.layer-block--l1 { background: linear-gradient(180deg, #FFF4EF 0%, #FFFFFF 60%); border-color: #F3CDBC; }
.layer-block--l2 { background: linear-gradient(180deg, #EEF8F6 0%, #FFFFFF 60%); border-color: #BFE3DD; }
.layer-block--l3 { background: linear-gradient(180deg, #F1EEF8 0%, #FFFFFF 60%); border-color: #D6CCEA; }

.layer-block-head {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap;
}
.layer-icon { font-size: 18px; }
.layer-name { font-size: 17px; font-weight: 700; }
.layer-sub { font-size: 12.5px; color: var(--ink-soft); }

.academy-only-badge {
  display: inline-block; background: #FFF3E0; color: #B5752E;
  font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px;
  margin-bottom: 14px; letter-spacing: 0.02em;
}

.radar-wrap { display: flex; justify-content: center; margin: 16px 0 20px; }

.axis-legend { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; padding: 0 4px; }
.axis-legend-item { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; }
.axis-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
.axis-name { font-weight: 700; flex-shrink: 0; min-width: 56px; }
.axis-desc { color: var(--ink-soft); }

.type-label {
  display: inline-block; background: var(--ink); color: white;
  font-size: 15px; font-weight: 700; padding: 8px 16px; border-radius: 100px;
  margin-bottom: 12px;
}
.type-desc { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 16px; }

.detail-grid { display: grid; gap: 10px; margin-top: 14px; }
.detail-row { display: flex; gap: 10px; font-size: 13.5px; padding: 10px 12px; background: #F7F4EE; border-radius: 8px; }
.detail-row .k { font-weight: 700; flex-shrink: 0; min-width: 76px; color: var(--ink-soft); }

.gauge-row { margin-bottom: 18px; }
.gauge-head { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
.gauge-band-label { color: var(--l3-color); font-weight: 700; }
.gauge-track { height: 12px; background: var(--line); border-radius: 100px; overflow: hidden; }
.gauge-fill { height: 100%; border-radius: 100px; }
.gauge-text { font-size: 13px; color: var(--ink-soft); margin-top: 8px; line-height: 1.55; }

.recipe-item { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.recipe-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.recipe-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; background: var(--coral); color: white;
  font-size: 12px; font-weight: 700; margin-right: 8px;
}
.recipe-title { font-weight: 700; font-size: 14.5px; display: inline; }
.recipe-body { font-size: 13.5px; color: var(--ink-soft); margin-top: 8px; padding-left: 30px; }

.academy-section { margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.academy-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.academy-section-title {
  font-weight: 700; font-size: 14.5px; margin-bottom: 8px;
  color: var(--ink); display: flex; align-items: center; gap: 6px;
}
.academy-body { font-size: 13.5px; color: var(--ink-soft); line-height: 1.7; }

.guide-box {
  background: #F7F4EE; border-radius: 10px; padding: 16px; margin-bottom: 14px;
}
.guide-box .gtitle { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.guide-box ul { padding-left: 18px; font-size: 13.5px; color: var(--ink-soft); }
.guide-box li { margin-bottom: 4px; }

@media print {
  @page { size: A4; margin: 12mm 14mm; }
  .print-bar, .no-print, #submit-badge { display: none !important; }
  html, body {
    background: white;
    height: auto !important;
    overflow: visible !important;
    margin: 0 !important; padding: 0 !important;
  }
  #app {
    max-width: 100% !important;
    min-height: 0 !important;
    overflow: visible !important;
    position: static !important;
  }
  .screen {
    display: block !important;
    animation: none !important;
    padding: 0 !important;
    overflow: visible !important;
  }
  .result-page {
    border: none; padding: 0; margin: 0;
    overflow: visible !important;
  }
  .result-page + .result-page { margin-top: 8mm; padding-top: 6mm; border-top: 1px dashed #C9CDD6; }
  .layer-block { page-break-inside: avoid; break-inside: avoid; }
  .guide-box { page-break-inside: avoid; break-inside: avoid; }
  .academy-section { page-break-inside: avoid; break-inside: avoid; }
  svg { max-width: 100% !important; }

  /* ===== 인쇄 집약 레이아웃: 화면용 1단 구조를 인쇄 전용으로 축소·2단화 ===== */
  * { print-color-adjust: exact !important; -webkit-print-color-adjust: exact !important; }

  .result-header { margin-bottom: 10px; padding-bottom: 8px; }
  .result-header .title { font-size: 17px; }
  .result-header .meta { font-size: 11px; }

  .io-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  .gauge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .academy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }

  .layer-block {
    padding: 9px 10px 9px 13px; margin-bottom: 8px; border-radius: 6px;
    border-width: 1px; border-left-width: 5px;
  }
  .layer-block--l1 { background: #FDE9DF !important; border-color: #E8633C !important; }
  .layer-block--l2 { background: #DEF1ED !important; border-color: #2A9D8F !important; }
  .layer-block--l3 { background: #E7E1F2 !important; border-color: #6B5CA5 !important; }
  .layer-block-head { margin-bottom: 2px; }
  .layer-icon { font-size: 12px; }
  .layer-name { font-size: 11.5px; }
  .layer-sub { font-size: 9px; }

  .radar-wrap svg { width: 130px !important; height: 130px !important; }
  .radar-wrap { margin: 4px 0 6px; }

  .axis-legend { gap: 2px; margin-bottom: 6px; }
  .axis-legend-item { font-size: 8.5px; }
  .axis-name { min-width: 38px; }
  .axis-dot { width: 6px; height: 6px; }

  .type-label { font-size: 10px; padding: 3px 9px; margin-bottom: 5px; }
  .type-desc { font-size: 9.5px; margin-bottom: 6px; line-height: 1.4; }
  .detail-grid { gap: 4px; margin-top: 5px; }
  .detail-row { font-size: 9px; padding: 5px 7px; gap: 5px; line-height: 1.35; background: rgba(255,255,255,0.75) !important; border: 1px solid rgba(28,37,65,0.12); }
  .detail-row .k { min-width: 48px; }

  .gauge-row { margin-bottom: 0; background: rgba(255,255,255,0.6) !important; padding: 4px 6px; border-radius: 4px; }
  .gauge-head { font-size: 9.5px; margin-bottom: 2px; }
  .gauge-track { height: 5px; margin-bottom: 3px; background: rgba(28,37,65,0.12) !important; }
  .gauge-text { font-size: 8.5px; line-height: 1.35; }

  .section-title { font-size: 13px; margin: 0 0 8px; }
  .academy-only-badge { font-size: 8.5px; padding: 2px 7px; margin-bottom: 8px; background: #FFE0B0 !important; color: #8A5A1E !important; }
  .academy-section { margin-bottom: 9px; padding-bottom: 8px; border-bottom: 1px solid #C9CDD6 !important; }
  .academy-section-title { font-size: 10.5px; margin-bottom: 3px; }
  .academy-body { font-size: 9px; line-height: 1.45; }

  .guide-box { padding: 9px 9px 9px 12px; margin-bottom: 0; border-left: 5px solid #C9CDD6; background: #EFEEEA !important; border-radius: 6px; }
  .guide-box:nth-of-type(1) { border-left-color: #2A9D8F !important; background: #DEF1ED !important; }
  .guide-box:nth-of-type(2) { border-left-color: #E8633C !important; background: #FDE9DF !important; }
  .guide-box:nth-of-type(3) { border-left-color: #E8A33C !important; background: #FCEFD9 !important; }
  .guide-box:nth-of-type(4) { border-left-color: #9A937F !important; background: #EFEBE0 !important; }
  .gtitle { font-size: 10.5px; margin-bottom: 4px; }
  .guide-box ul { font-size: 9px; line-height: 1.45; padding-left: 16px; }
  .guide-box li { margin-bottom: 2px; }
}

@media (max-width: 420px) {
  .q-text { font-size: 19px; }
  .landing-title { font-size: 24px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script src="questions.js"></script>
<script src="scoring.js"></script>
<script src="interpretations.js"></script>
<script src="result-renderer.js"></script>
<script src="validity.js"></script>
<script src="app.js"></script>
</body>
</html>
