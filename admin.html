<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --paper: #F4F5F7; --ink: #1C2541; --ink-soft: #4A5578;
  --coral: #E8633C; --teal: #2A9D8F; --gold: #E8A33C;
  --line: #DDE1E8; --card: #FFFFFF; --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Pretendard', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; }
.font-display { font-family: 'Gowun Batang', serif; }

#app { max-width: 1080px; margin: 0 auto; min-height: 100vh; padding: 28px 24px 80px; }

.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.top-title { font-size: 20px; font-weight: 700; }
.top-sub { font-size: 13px; color: var(--ink-soft); }

/* ===== 필터 바 ===== */
.filter-bar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 20px;
}
.filter-bar input, .filter-bar select {
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; font-family: inherit; color: var(--ink);
}
.filter-bar input[type="text"] { flex: 1; min-width: 160px; }
.btn-sm {
  padding: 0 16px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px; border: none; background: var(--ink); color: white; box-sizing: border-box;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; line-height: 1; vertical-align: middle;
}
.btn-sm.outline { background: white; border: 1px solid var(--ink); color: var(--ink); }
.top-bar .btn-sm { margin-left: 8px; }
.top-actions { display: flex; gap: 8px; }
.top-actions .btn-sm { margin-left: 0; width: 116px; padding: 0 8px; white-space: nowrap; }

/* ===== 통계 카드 ===== */
.stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
.stat-box .num { font-size: 20px; font-weight: 700; }
.stat-box .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

/* ===== 테이블 ===== */
.table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 12px 14px; background: #F7F4EE; font-weight: 700; font-size: 13px; color: var(--ink-soft); border-bottom: 1px solid var(--line); }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); }
tr.row-clickable { cursor: pointer; transition: background 0.1s; }
tr.row-clickable:hover { background: #FFF9F6; }
tr:last-child td { border-bottom: none; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; background: #EFEBE0; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }

.checkbox-cell { width: 36px; }

/* ===== 모달(상세 보기) ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,37,65,0.5); z-index: 100;
  display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto; padding: 40px 16px;
}
.modal-box { background: var(--paper); max-width: 720px; width: 100%; border-radius: var(--radius); overflow: hidden; }
.modal-toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; background: var(--ink); position: sticky; top: 0;
}
.modal-toolbar button {
  flex: 1 1 auto; min-width: 90px; padding: 10px; border-radius: 8px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit;
}
.modal-toolbar .btn-close { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.4); flex: 0 0 auto; padding: 10px 16px; }
.view-toggle { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }
.view-toggle.active { background: white; color: var(--ink); }
.modal-body { padding: 20px; }

.result-page { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 22px; margin-bottom: 16px; }
.result-header { text-align: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
.result-header-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
.result-header-logo svg { flex-shrink: 0; }
.result-header .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.result-header .meta { font-size: 13px; color: var(--ink-soft); }
.section-title { font-size: 15px; font-weight: 700; margin: 24px 0 14px; }
.section-title:first-child { margin-top: 0; }

:root {
  --l1-color: #E8633C; --l2-color: #2A9D8F; --l3-color: #6B5CA5;
}
.layer-block { border-radius: 14px; padding: 18px 16px; margin-bottom: 20px; border: 1.5px solid var(--line); }
.layer-block:last-child { margin-bottom: 0; }
.layer-block--l1 { background: linear-gradient(180deg, #FFF4EF 0%, #FFFFFF 60%); border-color: #F3CDBC; }
.layer-block--l2 { background: linear-gradient(180deg, #EEF8F6 0%, #FFFFFF 60%); border-color: #BFE3DD; }
.layer-block--l3 { background: linear-gradient(180deg, #F1EEF8 0%, #FFFFFF 60%); border-color: #D6CCEA; margin-top: 24px; }
.layer-block-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 4px; flex-wrap: wrap; }
.layer-icon { font-size: 16px; }
.layer-name { font-size: 15px; font-weight: 700; }
.layer-sub { font-size: 11.5px; color: var(--ink-soft); }

.academy-only-badge {
  display: inline-block; background: #FFF3E0; color: #B5752E;
  font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 100px;
  margin-bottom: 12px; letter-spacing: 0.02em;
}

.radar-wrap { display: flex; justify-content: center; margin: 14px 0 18px; }
.radar-legend-row { display: flex; align-items: center; justify-content: center; gap: 34px; margin-bottom: 16px; padding: 4px 10px; }
.radar-legend-row .radar-wrap { flex-shrink: 0; margin-bottom: 0; }
.radar-legend-row .radar-wrap svg { width: 250px; height: auto; }
.axis-legend { display: flex; flex-direction: column; gap: 10px; width: 320px; flex-shrink: 0; flex-grow: 0; }
.axis-legend-item { display: flex; flex-direction: column; gap: 3px; font-size: 12px; padding: 10px 13px; background: rgba(255,255,255,0.6); border: 1px solid var(--line); border-radius: 9px; }
.axis-legend-item .axis-top { display: flex; align-items: center; gap: 6px; }
.axis-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.axis-name { font-weight: 700; }
.axis-desc { color: var(--ink-soft); line-height: 1.45; }
.type-label-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; margin-bottom: 14px; }
.persona-icon-wrap { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; flex-shrink: 0; border: 1.5px solid currentColor; border-radius: 12px; opacity: 0.9; }
.persona-icon-wrap .persona-icon { display: block; }
.type-label { display: inline-block; background: var(--ink); color: white; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 100px; }
.type-desc { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; }
.detail-grid { display: grid; gap: 8px; margin-top: 12px; }
.detail-row { display: flex; gap: 10px; font-size: 13px; padding: 9px 11px; background: #F7F4EE; border-radius: 8px; }
.detail-row .k { font-weight: 700; flex-shrink: 0; min-width: 70px; color: var(--ink-soft); }
.gauge-row { margin-bottom: 16px; }
.gauge-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
.gauge-band-label { color: var(--l3-color); font-weight: 700; }
.gauge-track { height: 10px; background: var(--line); border-radius: 100px; overflow: hidden; }
.gauge-fill { height: 100%; border-radius: 100px; }
.gauge-text { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
.recipe-item { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.recipe-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.recipe-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--coral); color: white; font-size: 11px; font-weight: 700; margin-right: 8px; }
.recipe-title { font-weight: 700; font-size: 13.5px; display: inline; }
.recipe-body { font-size: 12.5px; color: var(--ink-soft); margin-top: 7px; padding-left: 28px; }

.academy-section { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.academy-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.academy-section-title { font-weight: 700; font-size: 13.5px; margin-bottom: 7px; color: var(--ink); }
.academy-body { font-size: 12.5px; color: var(--ink-soft); line-height: 1.65; }
.guide-box { background: #F7F4EE; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.guide-box .gtitle { font-weight: 700; font-size: 13px; margin-bottom: 7px; }
.guide-box ul { padding-left: 17px; font-size: 12.5px; color: var(--ink-soft); }
.guide-box li { margin-bottom: 4px; }

.loading { text-align: center; padding: 60px; color: var(--ink-soft); }
.api-warning {
  background: #FFF3E0; border: 1px solid var(--gold); border-radius: 10px;
  padding: 14px 16px; margin-bottom: 20px; font-size: 13.5px; color: var(--ink);
}

@media print {
  @page { size: A4; margin: 14mm 15mm; }
  html, body { height: auto !important; overflow: visible !important; margin: 0 !important; padding: 0 !important; }
  .result-page { border: none; padding: 0; margin: 0; }
  .result-page + .result-page { margin-top: 10mm; padding-top: 8mm; border-top: 1px dashed #C9CDD6; }
  .layer-block, .guide-box, .academy-section, .counsel-card, .cc-section { page-break-inside: avoid; break-inside: avoid; }
  svg { max-width: 100% !important; }
  * { print-color-adjust: exact !important; -webkit-print-color-adjust: exact !important; }

  .result-header { margin-bottom: 16px; padding-bottom: 12px; }
  .result-header .title { font-size: 20px; }
  .result-header .meta { font-size: 12.5px; }

  .io-pair { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  .gauge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .academy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }

  .layer-block { padding: 13px 15px 13px 17px; margin-bottom: 12px; border-radius: 7px; border-width: 1px; border-left-width: 6px; }
  .layer-block--l1 { background: #FDE9DF !important; border-color: #E8633C !important; }
  .layer-block--l2 { background: #DEF1ED !important; border-color: #2A9D8F !important; }
  .layer-block--l3 { background: #E7E1F2 !important; border-color: #6B5CA5 !important; }
  .layer-block-head { margin-bottom: 6px; }
  .layer-icon { font-size: 15px; }
  .layer-name { font-size: 15px; }
  .layer-sub { font-size: 12px; }

  .radar-wrap svg { width: 250px !important; height: 250px !important; }
  .radar-wrap { margin: 0; }
  .radar-legend-row { display: flex !important; align-items: center; justify-content: center; gap: 30px; margin-bottom: 10px; padding: 6px 8px; }
  .radar-legend-row .radar-wrap { flex-shrink: 0; }
  .axis-legend { display: flex !important; flex-direction: column; gap: 10px; margin-bottom: 0; width: 300px; flex-shrink: 0; flex-grow: 0; }
  .axis-legend-item { font-size: 13px; padding: 12px 15px; }
  .axis-name { min-width: auto; }
  .axis-dot { width: 9px; height: 9px; }

  .type-label-row { gap: 10px; margin-top: 8px; margin-bottom: 8px; }
  .persona-icon-wrap { width: 38px; height: 38px; border-radius: 9px; }
  .persona-icon-wrap .persona-icon { width: 28px; height: 28px; }
  .type-label { font-size: 12.5px; padding: 5px 11px; }
  .type-desc { font-size: 12.5px; margin-bottom: 10px; line-height: 1.6; }
  .detail-grid { gap: 7px; margin-top: 8px; }
  .detail-row { font-size: 12px; padding: 8px 10px; gap: 8px; line-height: 1.5; background: rgba(255,255,255,0.78) !important; border: 1px solid rgba(28,37,65,0.12); }
  .detail-row .k { min-width: 62px; }

  .gauge-row { margin-bottom: 4px; background: rgba(255,255,255,0.65) !important; padding: 8px 10px; border-radius: 6px; }
  .gauge-head { font-size: 12.5px; margin-bottom: 5px; }
  .gauge-track { height: 7px; margin-bottom: 5px; background: rgba(28,37,65,0.12) !important; }
  .gauge-text { font-size: 12px; line-height: 1.55; }

  .section-title { font-size: 17px; margin: 0 0 12px; }
  .academy-only-badge { font-size: 10px; padding: 3px 9px; margin-bottom: 10px; background: #FFE0B0 !important; color: #8A5A1E !important; }
  .academy-section { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #C9CDD6 !important; }
  .academy-section-title { font-size: 13.5px; margin-bottom: 6px; }
  .academy-body { font-size: 12.5px; line-height: 1.6; }

  .guide-box { padding: 13px 14px 13px 16px; margin-bottom: 0; border-left: 6px solid #C9CDD6; background: #EFEEEA !important; border-radius: 7px; }
  .guide-box:nth-of-type(1) { border-left-color: #2A9D8F !important; background: #DEF1ED !important; }
  .guide-box:nth-of-type(2) { border-left-color: #E8633C !important; background: #FDE9DF !important; }
  .guide-box:nth-of-type(3) { border-left-color: #E8A33C !important; background: #FCEFD9 !important; }
  .guide-box:nth-of-type(4) { border-left-color: #9A937F !important; background: #EFEBE0 !important; }
  .gtitle { font-size: 13.5px; margin-bottom: 7px; }
  .guide-box ul { font-size: 12.5px; line-height: 1.6; padding-left: 18px; }
  .guide-box li { margin-bottom: 5px; }
}
/* ===== 마스터-디테일 레이아웃 ===== */
.md-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 20px; align-items: start; }
.md-list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: sticky; top: 20px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
.md-list-filter { padding: 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.md-list-filter input, .md-list-filter select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; font-family: inherit; width: 100%; }
.md-items { overflow-y: auto; flex: 1; }
.md-item { padding: 14px 16px; border-bottom: 1px solid #F0F1F3; cursor: pointer; transition: background .15s; }
.md-item:hover { background: #FAFBFC; }
.md-item.active { background: #FEF1EC; border-left: 3px solid var(--coral); padding-left: 13px; }
.md-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.md-item-name { font-weight: 700; font-size: 15px; color: var(--ink); }
.md-item-chip { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); background: var(--paper); padding: 2px 8px; border-radius: 100px; }
.md-item-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 3px; }
.md-item-types { font-size: 12px; color: var(--coral); font-weight: 600; }
.md-item-date { font-size: 11px; color: #A8AEB8; margin-top: 4px; }

.md-detail { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); min-height: 500px; overflow: hidden; }
.md-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 500px; text-align: center; }
.detail-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #FBFBFC; position: sticky; top: 0; z-index: 5; }
.detail-toolbar-name { font-size: 17px; font-weight: 700; }
.detail-toolbar-name span { font-size: 13px; color: var(--ink-soft); font-weight: 400; margin-left: 6px; }
.detail-toolbar-btns { display: flex; gap: 8px; }
.detail-toolbar-btns button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--ink); }
.detail-toolbar-btns .view-toggle.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.detail-body { padding: 24px; overflow-y: auto; max-height: calc(100vh - 120px); }

@media(max-width: 820px) {
  .md-layout { grid-template-columns: 1fr; }
  .md-list { position: static; max-height: 340px; }
  .detail-body { max-height: none; }
}

@media print {
  .top-bar, .stat-strip, .md-list, .detail-toolbar { display: none !important; }
  .md-layout { display: block !important; }
  .md-detail { border: none !important; }
  .detail-body { max-height: none !important; overflow: visible !important; padding: 0 !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<script src="interpretations.js"></script>
<script src="persona-icons.js"></script>
<script src="result-renderer.js"></script>
<script src="risk.js"></script>
<script src="counsel-card.js"></script>
<script src="admin.js"></script>
</body>
</html>
